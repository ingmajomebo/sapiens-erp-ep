# Verificación en cada cambio. Corre en pull requests y en las dos ramas
# desplegables, para que nada llegue a un servidor sin haber compilado y
# pasado los tests.

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Un push nuevo cancela la verificación anterior de la misma rama: no tiene
# sentido gastar minutos comprobando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Publicar el informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: ERP · compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # `npm run build` incluye `tsc -b`: un error de tipos detiene el pipeline
      - working-directory: frontend
        run: npm run build

  storefront:
    name: Tienda · compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - working-directory: storefront
        run: npm ci
      - working-directory: storefront
        run: npm run build

  # Vale más descubrir aquí que una imagen no construye, que descubrirlo
  # en mitad de un despliegue.
  images:
    name: Imágenes · construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: erp
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: storefront
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          push: false
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront
