# El repositorio es público: una clave commiteada queda expuesta al instante
# y sigue expuesta en el historial aunque se borre después.

name: Secretos

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  escaneo:
    name: Buscar credenciales filtradas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: una clave borrada en el último commit sigue
          # estando en los anteriores
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar que ningún .env real entró
        run: |
          FILTRADOS=$(git ls-files | grep -E '(^|/)\.env$|/[a-z]+\.env$' | grep -v example || true)
          if [ -n "$FILTRADOS" ]; then
            echo "::error::Hay archivos de entorno en el repositorio:"
            echo "$FILTRADOS"
            exit 1
          fi
          echo "Ningún .env real en el repositorio"
