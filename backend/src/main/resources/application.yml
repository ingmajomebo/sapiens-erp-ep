spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sapiens_erp?sslmode=disable}
    username: ${DB_USER:sapiens}
    password: ${DB_PASSWORD:sapiens}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:sapiens-erp-secret-key-change-in-production-min32}
    access-token-expiration: 900000      # 15 min en ms
    refresh-token-expiration: 604800000  # 7 días en ms
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}

server:
  port: ${PORT:8080}

ai:
  anthropic:
    api-key: ${AI_ANTHROPIC_API_KEY:}

logging:
  level:
    com.sapiens.erp: DEBUG
    org.springframework.security: WARN
