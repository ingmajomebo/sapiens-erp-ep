spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sapiens_erp}?sslmode=${DB_SSLMODE:disable}
    username: ${PGUSER:sapiens}
    password: ${PGPASSWORD:sapiens}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Límite del contenedor por encima del límite de negocio (5MB en QaAttachmentService)
  # para que el rechazo llegue como 409 con mensaje y no como conexión cortada
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

app:
  # Administrador inicial. En producción es obligatorio definirlas: sin ellas
  # no se crea ningún usuario y nadie puede entrar (a propósito).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  uploads:
    dir: ${UPLOADS_DIR:uploads/qa}
    products-dir: ${UPLOADS_PRODUCTS_DIR:uploads/products}
  jwt:
    secret: ${JWT_SECRET:sapiens-erp-secret-key-change-in-production-min32}
    access-token-expiration: 900000      # 15 min en ms
    refresh-token-expiration: 604800000  # 7 días en ms
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  customers:
    segmentation:
      new-max-purchases: 1   # hasta N compras sigue siendo NEW
      at-risk-days: 30       # días sin comprar para AT_RISK
      inactive-days: 90      # días sin comprar para INACTIVE

server:
  port: ${PORT:8080}

ai:
  anthropic:
    api-key: ${AI_ANTHROPIC_API_KEY:}

# Facturación electrónica ante la DIAN.
#
# El proveedor es intercambiable: `none` apaga la integración, `matias` la
# enciende. Todo sale del entorno; ninguna credencial vive en el repositorio.
#
# Un sistema sin configurar NO factura electrónicamente, a propósito: es
# preferible a enviar documentos con datos de relleno a nombre de la empresa.
einvoicing:
  provider: ${EINVOICING_PROVIDER:none}          # none | matias
  environment: ${EINVOICING_ENVIRONMENT:sandbox} # sandbox | production
  token: ${EINVOICING_TOKEN:}
  base-url: ${EINVOICING_BASE_URL:}              # vacío = la del ambiente
  timeout-seconds: ${EINVOICING_TIMEOUT_SECONDS:60}
  # Ciudad y código postal DANE que se envían cuando el cliente no los tiene.
  default-city-id: ${EINVOICING_DEFAULT_CITY_ID:}
  default-postal-code: ${EINVOICING_DEFAULT_POSTAL_CODE:}
  issuer:
    tax-id: ${EINVOICING_ISSUER_TAX_ID:}
    resolution-number: ${EINVOICING_ISSUER_RESOLUTION:}
    prefix: ${EINVOICING_ISSUER_PREFIX:}
    range-from: ${EINVOICING_ISSUER_RANGE_FROM:}
    range-to: ${EINVOICING_ISSUER_RANGE_TO:}

logging:
  level:
    com.sapiens.erp: DEBUG
    org.springframework.security: WARN
