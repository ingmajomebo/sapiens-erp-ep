server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los bundles de Vite llevan hash: cachean para siempre
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Medios de public/: video del hero, fotos, fuentes. El nombre NO lleva
    # hash, así que no pueden ser 'immutable': una semana de caché y después
    # se revalida contra el etag, que resuelve en 304 si nada cambió.
    location ~* \.(mp4|webm|jpg|jpeg|png|webp|avif|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Imágenes de producto servidas por el ERP: se cachean un rato
    location /api/v1/products/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 10m;
    }

    # El resto de la API. Mismo origen que la tienda: sin CORS y, sobre todo,
    # sin URL de backend compilada en el bundle. Por eso la MISMA imagen sirve
    # para desarrollo y para producción.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
