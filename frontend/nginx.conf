server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Por encima del límite de Spring (7MB) para que un archivo grande lo
    # rechace la app con 409 y mensaje, no Nginx cortando la conexión.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los bundles de Vite llevan hash en el nombre: cachean para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea, así el deploy se ve al instante
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
