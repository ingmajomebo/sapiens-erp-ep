# Proxy de borde del VPS. Es el único que ocupa los puertos 80 y 443, y no
# pertenece a ningún proyecto: los proyectos se cuelgan de él.
#
# Cada proyecto deja su archivo en sites/ y se une a la red `edge`.
# Añadir o retirar uno no toca la configuración de los demás.
#
#   docker network create edge     # una sola vez
#   docker compose up -d

name: edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Lo lee {$ACME_EMAIL} en el Caddyfile
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      # Los certificados se conservan aquí. El volumen es externo y viene del
      # Caddy que servía agenda: así los certificados ya emitidos se reutilizan
      # y la migración no tiene que pedirlos de nuevo.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge

volumes:
  # Se reutiliza el volumen del Caddy anterior para heredar los certificados.
  # Si se prefiere empezar de cero, quitar `external` y cambiar el nombre.
  caddy_data:
    external: true
    name: agenda_caddy_data
  caddy_config:
  caddy_logs:
