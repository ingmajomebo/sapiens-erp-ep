# Nginx del VPS. Termina TLS y reparte a los cuatro sitios.
#
#   cp deploy/nginx-host.conf /etc/nginx/sites-available/encanto
#   sed -i 's/TUDOMINIO.COM/encantopacifico.com/g' /etc/nginx/sites-available/encanto
#   ln -sf /etc/nginx/sites-available/encanto /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d encantopacifico.com -d www.encantopacifico.com \
#           -d admin.encantopacifico.com -d dev.encantopacifico.com \
#           -d dev-admin.encantopacifico.com
#
# Se deja en HTTP puro a propósito: certbot añade el bloque 443, el
# certificado y la redirección 80 -> 443 en cada server.

# ── Producción · tienda ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name TUDOMINIO.COM www.TUDOMINIO.COM;

    client_max_body_size 10m;
    access_log /var/log/nginx/tienda.access.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Producción · panel administrativo ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.TUDOMINIO.COM;

    client_max_body_size 10m;
    access_log /var/log/nginx/erp.access.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Desarrollo · tienda ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dev.TUDOMINIO.COM;

    client_max_body_size 10m;

    # Desarrollo no debe indexarse nunca: sería contenido duplicado
    # y expondría pruebas en los buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Y no debe ser público: solo tu equipo.
    # Crear con:  htpasswd -c /etc/nginx/.htpasswd-dev <usuario>
    auth_basic "Ambiente de desarrollo";
    auth_basic_user_file /etc/nginx/.htpasswd-dev;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Desarrollo · panel administrativo ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dev-admin.TUDOMINIO.COM;

    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Ambiente de desarrollo";
    auth_basic_user_file /etc/nginx/.htpasswd-dev;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
