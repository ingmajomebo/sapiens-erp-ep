version: "2"
type: frontend
tech_stack:
  - language: TypeScript
  - framework: React 18 + Vite
  - ui_library: Custom inline styles (no external UI library)
  - state_management: Zustand
  - data_fetching: TanStack Query (React Query)
  - http_client: Axios
  - other: xlsx (Excel import), i18n via translations.ts

routes:
  - path: /
    file: frontend/src/App.tsx
    auth_required: false
    description: Root entry — shows LoginPage if no accessToken, otherwise the full app shell
  - path: /#dashboard
    file: frontend/src/features/dashboard/Dashboard.tsx
    auth_required: true
    description: Dashboard with KPIs, charts, low-stock and expiring items
  - path: /#inventory
    file: frontend/src/features/inventory/Inventory.tsx
    auth_required: true
    description: Inventory management — product list, stock status, lots, movements
  - path: /#purchases
    file: frontend/src/features/purchases/Purchases.tsx
    auth_required: true
    description: Purchase orders list
  - path: /#sales
    file: frontend/src/features/sales/Sales.tsx
    auth_required: true
    description: Sales orders list
  - path: /#cash
    file: frontend/src/features/cash/CashRegister.tsx
    auth_required: true
    description: Cash register / POS
  - path: /#accountsPayable
    file: frontend/src/features/finance/AccountsPayablePage.tsx
    auth_required: true
    description: Accounts payable management
  - path: /#accountsReceivable
    file: frontend/src/features/finance/AccountsReceivable.tsx
    auth_required: true
    description: Accounts receivable
  - path: /#cashBanks
    file: frontend/src/features/finance/CashBanks.tsx
    auth_required: true
    description: Cash and bank accounts
  - path: /#expenses
    file: frontend/src/features/finance/Expenses.tsx
    auth_required: true
    description: Expense management
  - path: /#accounting
    file: frontend/src/features/finance/Accounting.tsx
    auth_required: true
    description: Accounting / ledger view
  - path: /#project
    file: frontend/src/features/project/ProjectPage.tsx
    auth_required: true
    description: Project management page
  - path: /#settings
    file: frontend/src/features/settings/Settings.tsx
    auth_required: true
    description: App settings (theme, language, company name, brand colors)

features:
  - name: User Login
    description: Authenticate with email and password; receives JWT access + refresh tokens
    files:
      - frontend/src/features/auth/LoginPage.tsx
      - frontend/src/features/auth/api/authApi.ts
      - frontend/src/store/useAuthStore.ts
    entry_route: /
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Toggle password visibility with eye icon button
      - Click "Iniciar sesión" button to submit
      - See error message on invalid credentials
    api_calls:
      - method: POST
        endpoint: /api/v1/auth/login
    auth_required: false

  - name: Dashboard Overview
    description: Shows KPI cards (revenue, expenses, gross margin, inventory value), weekly sales/expenses chart, top products, low-stock alerts, expiring items, recent sales and purchases
    files:
      - frontend/src/features/dashboard/Dashboard.tsx
      - frontend/src/data/mockData.ts
    entry_route: /#dashboard
    user_interactions:
      - View KPI cards with trend indicators
      - View bar chart of sales vs expenses by day
      - View category distribution legend
      - Click "Ver todo" on top products to navigate to inventory
      - Click "Reorder" on low-stock items to open purchase order drawer
      - Click "Ver todo" on recent sales to navigate to sales page
      - Click "Ver todo" on recent purchases to navigate to purchases page
    api_calls: []
    auth_required: true
    known_limitations:
      - Dashboard KPIs and charts use mock data, not live API

  - name: Inventory Management
    description: List, filter, search, and paginate products grouped by category; view stock status; open product detail modal with info, lots, and movement tabs; delete products; import products from Excel
    files:
      - frontend/src/features/inventory/Inventory.tsx
      - frontend/src/features/catalog/api/productApi.ts
      - frontend/src/features/inventory/api/inventoryApi.ts
    entry_route: /#inventory
    user_interactions:
      - Search products by name, SKU, or barcode
      - Filter by category, stock status, product type, unit of measure, warehouse
      - Click product row to open detail modal
      - Switch between Info, Lots, and Movements tabs in detail modal
      - Click "Eliminar" to delete a product (with confirmation dialog)
      - Click "+ Nuevo producto" to open new product drawer
      - Click "Importar Excel" to open Excel import modal
      - Select .xlsx/.xls file and confirm bulk import
      - Navigate between pages with pagination controls
      - Click category header row to collapse/expand category group
    api_calls:
      - method: GET
        endpoint: /api/v1/products
      - method: GET
        endpoint: /api/v1/inventory/stock
      - method: GET
        endpoint: /api/v1/inventory/lots/expiring
      - method: GET
        endpoint: /api/v1/inventory/movements
      - method: GET
        endpoint: /api/v1/inventory/lots/{productId}
      - method: DELETE
        endpoint: /api/v1/products/{id}
      - method: POST
        endpoint: /api/v1/products/bulk
    auth_required: true

  - name: Sales Orders
    description: View sales orders list filtered by status; create new sale via drawer
    files:
      - frontend/src/features/sales/Sales.tsx
      - frontend/src/data/mockData.ts
    entry_route: /#sales
    user_interactions:
      - Filter sales orders by status (all, pending, confirmed, delivered, cancelled)
      - Click "+ Nueva venta" to open new sale drawer
      - Click export button
      - View order rows with ID, customer, date, items, total, payment, status
    api_calls: []
    auth_required: true
    known_limitations:
      - Sales orders use mock data, not live API

  - name: Purchase Orders
    description: View and manage purchase orders from suppliers
    files:
      - frontend/src/features/purchases/Purchases.tsx
      - frontend/src/features/procurement/api/purchaseOrderApi.ts
      - frontend/src/features/procurement/api/supplierApi.ts
    entry_route: /#purchases
    user_interactions:
      - View purchase orders list
      - Create new purchase order via drawer
    api_calls:
      - method: GET
        endpoint: /api/v1/purchase-orders
    auth_required: true

  - name: Accounts Payable
    description: Manage supplier invoices and payment obligations
    files:
      - frontend/src/features/finance/AccountsPayablePage.tsx
      - frontend/src/features/procurement/api/accountsPayableApi.ts
    entry_route: /#accountsPayable
    user_interactions:
      - View accounts payable list
      - Filter by status or supplier
    api_calls:
      - method: GET
        endpoint: /api/v1/accounts-payable
    auth_required: true

  - name: Cash Register
    description: POS / cash register for processing sales transactions
    files:
      - frontend/src/features/cash/CashRegister.tsx
    entry_route: /#cash
    user_interactions:
      - View cash register interface
      - Process transactions
    api_calls: []
    auth_required: true

  - name: Expenses
    description: Record and view operational expenses
    files:
      - frontend/src/features/finance/Expenses.tsx
      - frontend/src/features/finance/api/expensesApi.ts
    entry_route: /#expenses
    user_interactions:
      - View expenses list
      - Add new expense
    api_calls:
      - method: GET
        endpoint: /api/v1/expenses
      - method: POST
        endpoint: /api/v1/expenses
    auth_required: true

  - name: Settings
    description: Configure app theme (light/dark), UI language (ES/EN), company name, and brand accent colors
    files:
      - frontend/src/features/settings/Settings.tsx
      - frontend/src/store/useAppStore.ts
    entry_route: /#settings
    user_interactions:
      - Toggle between light and dark theme
      - Switch language between Spanish and English
      - Edit company name
      - Change accent color and sidebar color
    api_calls: []
    auth_required: true

known_limitations:
  - issue: Dashboard KPI cards and charts use hardcoded mock data
    location: frontend/src/features/dashboard/Dashboard.tsx
    impact: Metrics shown are not real; create/update operations have no backend effect from dashboard
  - issue: Sales orders use mock data from mockData.ts, not connected to backend API
    location: frontend/src/features/sales/Sales.tsx
    impact: Sales list always shows same dummy rows; new sale drawer may not persist
  - issue: Navigation is state-based (Zustand page key), not URL-based router — no true URL routes
    location: frontend/src/App.tsx
    impact: Browser back/forward navigation does not work; direct URL access always loads dashboard
