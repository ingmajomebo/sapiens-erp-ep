# Stack desplegable de Sapiens ERP + tienda Encanto Pacífico.
#
# El MISMO archivo levanta desarrollo y producción. Lo que cambia es el
# archivo de entorno que se le pase:
#
#   docker compose --env-file deploy/env/prod.env -f docker-compose.stack.yml up -d
#   docker compose --env-file deploy/env/dev.env  -f docker-compose.stack.yml up -d
#
# COMPOSE_PROJECT_NAME separa contenedores, redes y volúmenes entre ambientes.

name: ${STACK_NAME:-encanto}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Sin `ports`: la BD nunca se expone fuera de la red del stack

  backend:
    image: ${REGISTRY}/erp-backend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOADS_DIR: /app/uploads/qa
      UPLOADS_PRODUCTS_DIR: /app/uploads/products
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
      # Facturación electrónica. Sin EINVOICING_PROVIDER queda apagada.
      EINVOICING_PROVIDER: ${EINVOICING_PROVIDER:-none}
      EINVOICING_ENVIRONMENT: ${EINVOICING_ENVIRONMENT:-sandbox}
      EINVOICING_TOKEN: ${EINVOICING_TOKEN:-}
      EINVOICING_BASE_URL: ${EINVOICING_BASE_URL:-}
      EINVOICING_ISSUER_TAX_ID: ${EINVOICING_ISSUER_TAX_ID:-}
      EINVOICING_ISSUER_RESOLUTION: ${EINVOICING_ISSUER_RESOLUTION:-}
      EINVOICING_ISSUER_PREFIX: ${EINVOICING_ISSUER_PREFIX:-}
      EINVOICING_ISSUER_RANGE_FROM: ${EINVOICING_ISSUER_RANGE_FROM:-}
      EINVOICING_ISSUER_RANGE_TO: ${EINVOICING_ISSUER_RANGE_TO:-}
      EINVOICING_DEFAULT_CITY_ID: ${EINVOICING_DEFAULT_CITY_ID:-}
      EINVOICING_DEFAULT_POSTAL_CODE: ${EINVOICING_DEFAULT_POSTAL_CODE:-}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Panel administrativo
  erp:
    image: ${REGISTRY}/erp-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Publicado en loopback para poder diagnosticar desde el propio servidor
    ports:
      - "127.0.0.1:${ERP_PORT}:80"
    networks:
      default:
      edge:
        # Alias estable: el Caddy del borde apunta a este nombre y sobrevive
        # a un redespliegue, aunque el contenedor cambie de identificador.
        aliases:
          - ${STACK_NAME}-erp

  # Tienda pública
  storefront:
    image: ${REGISTRY}/storefront:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STOREFRONT_PORT}:80"
    networks:
      default:
      edge:
        aliases:
          - ${STACK_NAME}-storefront

networks:
  # Red interna del stack: postgres y backend viven solo aquí, sin salida
  default:
  # Red del proxy de borde. Externa: la crea la infraestructura, no el
  # proyecto, y la comparten todos los stacks del VPS. Solo los servicios web
  # se unen a ella; postgres y backend se quedan en la red interna.
  edge:
    external: true
    name: edge

volumes:
  pgdata:
  uploads:
